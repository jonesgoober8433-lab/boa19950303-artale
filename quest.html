const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const raw=b64(BLOB), salt=raw.slice(8,16), data=raw.slice(16);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},base,384));
  const key=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-CBC',false,['decrypt']);
  const plain=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv:bits.slice(32,48)},key,data));
  if(!plain.startsWith('FPv1:')) throw new Error('bad');
  return plain.slice(5);
}
$('f').onsubmit=async e=>{
  e.preventDefault();
  if(!(window.crypto&&crypto.subtle)){ $('err').textContent='這個瀏覽器無法解鎖，請改用 Chrome。'; return; }
  $('go').disabled=true; $('err').textContent='解鎖中…';
  try{ const html=await unlock($('pw').value.trim()); document.open(); document.write(html); document.close(); }
  catch(_){ $('err').textContent='密碼不正確'; $('go').disabled=false; $('pw').select(); }
};
})();
