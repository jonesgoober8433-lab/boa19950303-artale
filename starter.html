<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>小號必去｜阿泰爾工具箱</title>
<style>
:root{--bg:#f5ecdb;--card:#fffaf0;--fg:#3a2f25;--muted:#86745f;--line:#e8dcc3;--accent:#a4602a;--soft:#f4e8cf;--warn:#84560f;--warn-bg:#f6e6c4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:20px 16px 60px}
.wrap{max-width:1200px;margin:0 auto}
h1{font:700 28px "Noto Serif TC","Songti TC",serif;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 14px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.tab{border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:999px;padding:6px 22px;font:700 16px inherit;cursor:pointer}
.tab.on{background:var(--accent);color:var(--card)}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px 14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap}
td.lv{font-weight:700;white-space:nowrap;color:var(--accent)}
td.exp{font-weight:700;white-space:nowrap;text-align:right}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:14px;margin:12px 0}
.note b{display:block;margin-bottom:2px}
h2{font:700 18px "Noto Serif TC","Songti TC",serif;margin:16px 0 4px}
small{color:var(--muted)}
.src{margin-top:18px;color:var(--muted);font-size:13px}

.chip{display:inline-block;padding:0 8px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.7;margin:0 3px 2px 0;white-space:nowrap}
.c-eq{background:#e3edf6;color:#2f5f8a}.c-sc{background:#f8e2da;color:#a8392b}.c-xp{background:#e6efd9;color:#4d7a36}.c-bo{background:#efe3f6;color:#6b3f8a}
tr.hot td{background:#fff1d6}
.hotb{display:inline-block;background:#d9822b;color:#fff;border-radius:999px;padding:0 9px;font-weight:700;font-size:13px;white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.fl{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:3px 14px;font:inherit;font-size:14px;cursor:pointer}
.fl.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.top{background:var(--card);border:1px solid #d9822b;border-radius:12px;padding:8px 14px;margin:0 0 12px;font-size:15px}
.cfrow{padding:10px 0;border-bottom:1px solid var(--line)}
.cfrow .q{font-weight:700}.cfrow .h{color:var(--muted);font-size:13px;margin:0 0 6px}
.cfrow input[type=text],textarea{width:100%;font:inherit;background:#fdf6e6;border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--fg)}
.qp{display:inline-block;margin:0 6px 6px 0;border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:999px;padding:1px 12px;font:inherit;font-size:14px;cursor:pointer}
.cpy{border:0;background:var(--accent);color:var(--card);border-radius:999px;padding:9px 26px;font:700 16px inherit;cursor:pointer;margin:14px 10px 0 0}
#cfmsg{color:var(--good,#4d7a36);font-weight:700}

.rtg{font:700 17px "Noto Serif TC",serif;margin:16px 0 4px}
.rtstep{padding:10px 0;border-bottom:1px solid var(--line)}
.rtstep .t{font-weight:700}.rtstep .t small{font-weight:400}
.rtstep .c{color:var(--muted);font-size:14px;margin:2px 0 6px}
.rtb{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:2px 14px;font:inherit;font-size:14px;cursor:pointer;margin:0 6px 4px 0}
.rtb.ok.on{background:#e6efd9;border-color:#4d7a36;color:#4d7a36;font-weight:700}
.rtb.bad.on{background:#f8e2da;border-color:#a8392b;color:#a8392b;font-weight:700}
.rtn{width:100%;font:inherit;background:#fdf6e6;border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--fg);margin-top:2px;display:none}
.rtn.show{display:block}

.rqw{overflow-x:auto;margin-top:8px}
.rqt{border-collapse:collapse;min-width:900px;width:100%;font-size:14px}
.rqt th{font-size:12px;color:var(--muted);font-weight:500;padding:3px 6px;text-align:left;border:0}
.rqt td{padding:3px 4px;border:0;vertical-align:top}
.rqt input[type=text]{width:100%;font:inherit;font-size:14px;background:#fdf6e6;border:1px solid var(--line);border-radius:8px;padding:4px 7px;color:var(--fg)}
.rqt input.chg{background:#f8e2da;border-color:#a8392b}
.rqt .nm{font-weight:700;white-space:nowrap;padding-right:8px;padding-top:7px}

.wrap{width:100%}#gate{max-width:420px;margin:8vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center}
#gate input{width:100%;font:inherit;background:#fdf6e6;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:10px 0;color:var(--fg)}
#gate .err{color:#a8392b;min-height:1.4em;font-size:14px}
</style></head><body>
