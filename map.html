<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地圖指引｜阿泰爾工具箱</title>
<link rel="icon" type="image/svg+xml" href="ui/title-icon.svg">
<style>
:root{--bg:#f5ecdb;--card:#fffaf0;--fg:#3a2f25;--muted:#86745f;--line:#e8dcc3;--accent:#a4602a;--accent-ink:#fffaf0;--soft:#f4e8cf;--field:#fdf6e6;--good:#4d7a36;--good-bg:#e6efd9;--warn:#84560f;--warn-bg:#f6e6c4}
*{box-sizing:border-box}html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
header,main{max-width:960px;margin:0 auto;padding:0 16px}
header{padding-top:20px}
h1{margin:0 0 4px;font:700 26px "Noto Serif TC","Songti TC",serif;letter-spacing:.04em}
.sub{color:var(--muted);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
input[type=text],input[type=number]{font:inherit;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--fg);width:100%}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 2px}
.sel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
button.sw .sv{display:none}@media(max-width:620px){button.sw .sh{display:none}button.sw .sv{display:inline}.sel{grid-template-columns:1fr}.sel .sw{justify-self:center}}
button{font:inherit;font-weight:700;border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:999px;padding:6px 18px;cursor:pointer}
button.p{background:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:10px}
.muted{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
[hidden]{display:none!important}#resModal{position:fixed;inset:0;z-index:15000;background:rgba(58,47,37,.55);display:flex;align-items:center;justify-content:center;padding:14px}
#resModal .rbox{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;width:min(920px,100%);max-height:88vh;overflow:auto;padding:16px 16px 18px;box-shadow:0 16px 48px rgba(0,0,0,.35);overscroll-behavior:contain}
#resModal .rx{position:sticky;top:0;float:right;z-index:2;margin:-4px -4px 0 8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--accent);background:var(--card);color:var(--accent);font-size:16px;font-weight:700;cursor:pointer;line-height:1;padding:0}
@media(max-width:700px){#resModal{padding:62px 8px 8px;align-items:flex-start}#resModal .rbox{max-height:calc(100vh - 72px)}}
.cg{margin-top:10px}.cgt{font-size:13px;font-weight:700;color:var(--accent);border-left:3px solid var(--accent);padding-left:8px;margin-bottom:2px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;pointer-events:none;cursor:default}.cg .chips{margin-top:4px;min-height:30px}
.chip.drag{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;outline:1px dashed var(--accent)}.chip.dragging{opacity:.55;background:var(--soft);border-color:var(--accent)}
.sortbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.sortbar button{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:999px;padding:3px 12px;cursor:pointer}.sortbar button.on{background:var(--accent);color:var(--accent-ink)}
.maps-gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}@media(max-width:620px){.maps-gal{grid-template-columns:repeat(2,1fr)}}
.maps-gal figure{margin:0;cursor:zoom-in}.maps-gal img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px;background:var(--field)}.maps-gal figcaption{font-size:14px;text-align:center;margin-top:5px;line-height:1.45;-webkit-user-select:none;user-select:none}.maps-gal figcaption small{font-size:12.5px;color:var(--muted);font-weight:400}
#lb{position:fixed;inset:0;z-index:20000;background:rgba(40,30,20,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;gap:8px}#lb img{max-width:100%;max-height:84vh;border-radius:10px;touch-action:pinch-zoom}#lb span{color:#fffaf0;font-weight:700}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:1px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.chip:hover{background:var(--soft)}.chip.npc{border-style:dashed}
.route{border:1px solid var(--line);border-radius:12px;background:var(--field);padding:8px 12px;margin:8px 0}
.route .h{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.node{background:var(--soft);border-radius:8px;padding:1px 10px;font-weight:700}.node.npc{border:1px dashed var(--accent)}
.arr{color:var(--accent);text-align:center;font-size:13px}.arr small{display:block;color:var(--muted);font-size:11px;line-height:1.1}details.more{margin-top:10px}details.more summary{cursor:pointer;color:var(--accent);font-weight:700}
.tag{display:inline-block;padding:0 8px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.7}
.t-ok{background:var(--good-bg);color:var(--good)}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13.5px;margin-top:8px}
footer{color:var(--muted);font-size:12.5px;margin:20px 0 60px}
.steps{margin:8px 0 0;padding-left:18px;font-size:13.5px;color:var(--muted);line-height:1.7}.steps b{color:var(--fg)}.steps .tl{color:var(--accent);font-weight:700;margin-top:1px}
.elev{margin-top:8px;font-size:13.5px}.elev summary{cursor:pointer;font-weight:700;color:var(--accent)}.elevg{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:6px}.elevg table{border-collapse:collapse;width:100%}.elevg td{padding:2px 6px;border-bottom:1px solid var(--line)}.elevg td:first-child{width:34px;font-variant-numeric:tabular-nums;color:var(--muted)}@media(max-width:560px){.elevg{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>地圖指引</h1>
  <p class="sub">選出發地與目的地，列出所有走法，步數少的排前面。</p>
</header>
<main>
  <section class="card">
    <div class="sel">
      <div><label for="from">出發</label><input type="text" id="from" list="dl" placeholder="例如：魔法森林" autocomplete="off"></div>
      <button class="sw" id="swap" title="對調出發與目的地"><span class="sh">⇄</span><span class="sv">⇅</span></button>
      <div><label for="to">目的地</label><input type="text" id="to" list="dl" placeholder="例如：時間神殿" autocomplete="off"></div>
    </div>
    <datalist id="dl"></datalist>
    <div class="row" id="origRow" hidden><label style="margin:0">🌏 <span id="origQ">這是世界導遊的目的地，你是從哪裡搭過來的？</span> </label><input type="hidden" id="orig"><span class="chips" id="origChips" style="margin:0"></span><span class="muted">在這裡只能搭回你來的地方。</span></div>
    <div class="row">
      <button class="p" id="go">查詢</button>
    </div>
    <div class="muted" style="margin-top:8px">點下面的地圖名稱，會填進目前空著的欄位（先填出發，再填目的地）：</div>
    <div id="chips"></div>
    <div class="sortbar"><button type="button" id="sortBtn">✋ 調整排序</button><span id="sortTools" hidden><button type="button" id="sortCopy">📋 複製目前順序</button><button type="button" id="sortReset">↺ 還原預設</button></span><span class="muted" id="sortNote"></span></div>
  </section>
  <details class="card" id="galBox" open><summary style="cursor:pointer;font-weight:700;color:var(--accent)">🗺 世界地圖（點一下放大）</summary>
    <div class="maps-gal" id="gal"></div>
  </details>
  <div id="resModal" hidden role="dialog" aria-modal="true" aria-label="查詢結果"><div class="rbox"><button type="button" class="rx" id="resClose" aria-label="關閉">✕</button><div id="out"></div></div></div>
  <footer>路線依玩家整理的地圖連結計算，可能有漏填或錯誤，僅供參考。標在箭頭上的「世界導遊」代表那一段搭乘世界旅行導遊，不算一個站。搭世界導遊到泰國、西門町、日本之後，在那邊只能搭回原本出發的地方，不能再連搭去別處。</footer>
</main>

 ['路德斯湖',['玩具城','艾靈森林','童話村','地球防衛總部']],
 ['桃花仙境+納希沙漠',['桃花仙境','靈藥幻境','納希沙漠','瑪迦提亞城']],
 ['神木村',['神木村']],
 ['時間神殿',['時間神殿']],
 ['海外旅行',['101','日本','西門町','泰國','新加坡']],
 ['新葉城',['新葉城']]];
const OVERSEAS='海外旅行';
function orderedGroups(){
  let g=null;if(!LOCKED){try{g=JSON.parse(localStorage.getItem(ORDER_KEY)||'null')}catch(e){}}
  if(!Array.isArray(g)||!g.every(x=>x&&Array.isArray(x.m)))g=DEF_GROUPS.map(([n,m])=>({n,m:m.slice()}));
  const all=new Set(D.maps),seen=new Set();
  g=g.map(x=>({n:x.n,m:x.m.filter(m=>all.has(m)&&!seen.has(m)&&seen.add(m))}));
  const lost=defOrder().filter(m=>!seen.has(m));   // 沒有分類的（新加的地圖、泰國、日本、西門町、101…）→ 海外旅行
  let o=g.find(x=>x.n===OVERSEAS);if(!o){o={n:OVERSEAS,m:[]};g.push(o)}o.m=o.m.concat(lost);
  return g}
const defOrder=()=>D.maps.filter(m=>m!==VIC).sort((a,b)=>a.localeCompare(b,'zh-Hant'));
function renderChips(){$('chips').innerHTML=orderedGroups().filter(x=>x.m.length||EDIT).map(x=>`<div class="cg" data-g="${esc(x.n)}"><div class="cgt">${esc(x.n)}</div><div class="chips">${x.m.map(m=>`<span class="chip${EDIT?' drag':''}" data-m="${esc(m)}">${esc(m)}</span>`).join('')}</div></div>`).join('')}
let EDIT=false,dragEl=null,sx=0,sy=0,moved=false,justDragged=false;
renderChips();
function chipOrder(){return [...$('chips').querySelectorAll('.cg')].map(g=>({n:g.dataset.g,m:[...g.querySelectorAll('.chip')].map(c=>c.dataset.m)}))}
function setEdit(on){EDIT=on;$('sortBtn').classList.toggle('on',on);$('sortBtn').textContent=on?'✔ 完成排序':'✋ 調整排序';$('sortTools').hidden=!on;$('sortNote').textContent=on?'拖曳地圖名稱就能換位置，也可以拖到別的分類（這時點名稱不會填入欄位）':'';renderChips()}
if(LOCKED)document.querySelector('.sortbar').hidden=true;
$('sortBtn').onclick=()=>setEdit(!EDIT);
$('sortReset').onclick=()=>{try{localStorage.removeItem(ORDER_KEY)}catch(e){}renderChips()};
$('sortCopy').onclick=async()=>{const t=JSON.stringify(chipOrder());try{await navigator.clipboard.writeText(t);$('sortNote').textContent='✅ 已複製順序，貼給 Claude 就可以鎖定了'}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');$('sortNote').textContent='✅ 已複製順序'}catch(_){$('sortNote').textContent='複製失敗'}ta.remove()}};
$('chips').addEventListener('pointerdown',e=>{if(!EDIT)return;const c=e.target.closest('.chip');if(!c)return;dragEl=c;sx=e.clientX;sy=e.clientY;moved=false;try{c.setPointerCapture(e.pointerId)}catch(_){}});
$('chips').addEventListener('pointermove',e=>{if(!dragEl)return;if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)<6)return;moved=true;dragEl.classList.add('dragging');
  const prev=dragEl.style.pointerEvents;dragEl.style.pointerEvents='none';const under=document.elementFromPoint(e.clientX,e.clientY);dragEl.style.pointerEvents=prev;
  const t=under&&under.closest&&under.closest('#chips .chip');
  if(t&&t!==dragEl){const r=t.getBoundingClientRect(),after=e.clientX>r.left+r.width/2;t.parentNode.insertBefore(dragEl,after?t.nextSibling:t)}
  else if(!t){const g=under&&under.closest&&under.closest('#chips .cg');if(g){const box=g.querySelector('.chips');if(dragEl.parentNode!==box)box.appendChild(dragEl)}}});
function endDrag(){if(!dragEl)return;dragEl.classList.remove('dragging');if(moved){try{localStorage.setItem(ORDER_KEY,JSON.stringify(chipOrder()))}catch(e){}justDragged=true;setTimeout(()=>justDragged=false,50)}dragEl=null}
$('chips').addEventListener('pointerup',endDrag);$('chips').addEventListener('pointercancel',endDrag);
/* ===== 世界地圖圖片 + 放大 ===== */
const GAL=[['world','楓之谷世界',''],['victoria','維多利亞島',''],['maple','楓之島',''],['ice','冰原雪域山脈','天空之城、冰原雪域、水世界'],['ludus','路德斯湖','玩具城、艾靈森林、童話村、地球防衛總部'],['minar','米納爾森林','神木村'],['temple','時間神殿',''],['nahee','納希沙漠','瑪迦提亞城'],['wuling','武陵桃園','桃花仙境、靈藥幻境']];
$('gal').innerHTML=GAL.map(([f,n,s])=>`<figure data-f="${f}" data-n="${esc(n)}" data-s="${esc(s)}"><img src="map-img/${f}.webp" alt="${esc(n)}" loading="lazy"><figcaption><b>${esc(n)}</b>${s?`<br><small>${esc(s)}</small>`:''}</figcaption></figure>`).join('');
$('gal').addEventListener('click',e=>{const f=e.target.closest('figure');if(!f)return;const d=document.createElement('div');d.id='lb';d.innerHTML=`<img src="map-img/${f.dataset.f}.webp" alt=""><span>${esc(f.dataset.n)}</span>${f.dataset.s?`<span style="font-weight:400;font-size:14px">${esc(f.dataset.s)}</span>`:''}<span style="font-weight:400;font-size:13px;opacity:.8">再點一下關閉</span>`;d.style.textAlign='center';d.onclick=()=>d.remove();document.body.appendChild(d)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('lb')?.remove()});
const nm=s=>String(s).trim();
// 依步數由少到多（廣度優先），同一條路線不重複經過同一張地圖
// 世界導遊的目的地（只有導遊能到的地方，例如泰國、西門町、日本）：選它當出發地時，要問你是從哪裡搭過來的
const DEST=D.maps.filter(m=>adj[m].filter(v=>HOW[m+'|'+v]==='世界導遊').length>=6);   // 導遊連到很多地方的那端＝目的地（泰國、西門町、日本）
const GOV='世界導遊';
/* 「獨立地圖」＝拿掉導遊目的地之後，跟主要大陸斷開的小區塊（例如 101 只連到西門町）；從這裡出發也要問你是從哪裡搭導遊過來的 */
const POCKET=[],POCKET_DEST={};
(()=>{const rest=D.maps.filter(m=>!DEST.includes(m)),seen=new Set(),comps=[];
  for(const m of rest){if(seen.has(m))continue;const c=[m];seen.add(m);for(let i=0;i<c.length;i++)for(const v of adj[c[i]])if(!DEST.includes(v)&&!seen.has(v)){seen.add(v);c.push(v)}comps.push(c)}
  comps.sort((x,y)=>y.length-x.length);
  comps.slice(1).forEach(c=>{const ds=[...new Set(c.flatMap(m=>adj[m].filter(v=>DEST.includes(v))))];c.forEach(m=>{POCKET.push(m);POCKET_DEST[m]=ds})})})();
/* 只靠世界導遊進出的地圖（黃金海岸）：跟 101 一樣算獨立地圖，哪裡搭來就只能搭回哪裡 */
const SELFP=D.maps.filter(m=>!DEST.includes(m)&&adj[m].length&&adj[m].every(v=>HOW[m+'|'+v]===GOV));
const REGION=new Set([...DEST,...POCKET,...SELFP]);
const ASK=a=>REGION.has(a);
function origOpts(a){
  if(SELFP.includes(a))return adj[a].filter(v=>HOW[a+'|'+v]===GOV).map(v=>[v,v]);
  const ds=DEST.includes(a)?[a]:(POCKET_DEST[a]||[]);
  const names=[...new Set(ds.flatMap(d=>adj[d].filter(v=>HOW[d+'|'+v]===GOV)))];
  const walk=ds.some(d=>adj[d].some(v=>HOW[d+'|'+v]!==GOV&&!REGION.has(v)));   /* 只有真的能走路離開才有「自己走來」 */
  const opts=names.map(v=>[v,v]);if(walk)opts.push(['*',DEST.includes(a)?'不是搭導遊來的（自己走到這裡）':'沒搭導遊（自己走來的）']);return opts}
function syncOrig(){const a=nm($('from').value),row=$('origRow');
  if(ASK(a)){let cur=$('orig').dataset.for===a?$('orig').value:'';
    const opts=origOpts(a);
    if(!opts.some(o=>o[0]===cur))cur='';
    $('orig').value=cur;$('orig').dataset.for=a;
    $('origChips').innerHTML=opts.map(o=>`<span class="chip${o[0]===cur?' on':''}" data-o="${esc(o[0])}">${esc(o[1])}</span>`).join('');
    $('origQ').textContent=DEST.includes(a)?'這是世界導遊的目的地，你是從哪裡搭過來的？':'這裡只有搭世界導遊才方便離開，你上一次搭世界導遊是從哪裡過來的？';
    row.hidden=false}
  else{row.hidden=true;$('orig').dataset.for=''}}
function find(a,b,maxHop,cap,orig){
  const res=[];let q=[[a]],exp=0;
  for(let d=0;d<maxHop&&q.length&&res.length<cap;d++){
    const nq=[];
    for(const p of q){const u=p[p.length-1];
      for(const v of adj[u]){if(p.includes(v))continue;
        // 世界導遊：搭過去之後，在那邊只能搭回原本出發的地方，不能連續搭去別處
        if(HOW[u+'|'+v]===GOV&&p.length>1&&HOW[p[p.length-2]+'|'+u]===GOV)continue;   /* 世界導遊不能接著再搭世界導遊 */
        if(HOW[u+'|'+v]===GOV&&orig&&orig!=='*'&&p.every(x=>REGION.has(x))&&v!==orig)continue;   /* 從導遊目的地出發，只能搭回來的地方 */
        if(++exp>300000)return res;const np=p.concat(v);if(v===b){res.push(np);if(res.length>=cap)return res}else nq.push(np)}}
    q=nq}
  return res}
function noteOf(p){const n=(D.notes||{});const r=p.filter(x=>n[x]).map(x=>`<div class="muted" style="margin-top:6px">📌 ${esc(x)}：${esc(n[x])}</div>`).join('');return r}
/* ===== 依「現在的時間」推算搭船、搭飛機、搭地鐵的上車與抵達時間（Edward 指定）=====
   每條連結有「每小時第幾分起飛（dep）」與「搭乘幾分鐘（ride）」；搭船預設 0、10、20、30、40、50 分各一班，搭乘 6 分鐘。
   現在的分鐘剛好等於發車的分鐘，已經來不及上車，要搭下一班。計程車、直接傳送、世界導遊視為 0 分鐘；走路、搭電梯時間不計入。 */
const VEH={'飛機':'飛機','搭船':'船','地鐵':'車'};
const isElev=i=>i.mode==='搭電梯'&&!!i.top;   /* 電梯依赫爾奧斯塔時間表：樓下每 4 分鐘 03 分、樓上 01 分出發，搭乘 1 分鐘 */
const cleanTm=t=>String(t||'').replace(/[，,、]?\s*(?:(?:計程車|海豚|駱駝)?瞬間到|馬上到)/g,'').replace(/^[，,、\s]+|[，,、\s]+$/g,'');   /* 不顯示「瞬間到」 */
const hm=t=>{t=((t%1440)+1440)%1440;return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function schedOf(i){if(!VEH[i.mode])return null;if(/隨時/.test(i.dep||'')&&i.ride)return{any:1,ride:i.ride};let dep=(i.dep||'').split(/[,，、\s]+/).filter(x=>x!=='').map(Number).filter(x=>x>=0&&x<60),ride=i.ride;if(i.mode==='搭船'){if(!dep.length)dep=[0,10,20,30,40,50];if(!ride)ride=6}if(!dep.length||!ride)return null;return{dep:dep.sort((a,b)=>a-b),ride}}
function timeline(p,now){let t=now,broken=false,any=false,skip=false;const out=[];
  for(let k=0;k<p.length-1;k++){const i=INFO[p[k]+'|'+p[k+1]]||{},md=i.mode;let line='';
    if(VEH[md]){const s=schedOf(i);
      if(broken)line='';
      else if(!s){broken=true;line='時間表還沒補，後面的時間算不出來'}
      else if(s.any){const arr=t+s.ride;line=`隨時可上${VEH[md]}，${hm(arr)} 抵達`;t=arr;any=true}
      else{let d=t+1;while(!s.dep.includes(d%60))d++;const arr=d+s.ride;line=`${hm(d)} 前要上${VEH[md]}，${hm(arr)} 抵達`;t=arr;any=true}}
    else if(isElev(i)){if(broken)line='';else{const up=p[k]!==i.top,dm=up?3:1;let d=t+1;while(d%4!==dm)d++;const arr=d+1;line=`${hm(d)} 前要上電梯（${up?'樓下 → 樓上':'樓上 → 樓下'}），${hm(arr)} 抵達`;t=arr;any=true}}
    else if(md==='走路')skip=true;
    out.push(line)}
  return{out,end:(any&&!broken)?t:null,any,skip,broken}}
function stepsOf(p,tl){let rows='',elev=false;
  for(let k=0;k<p.length-1;k++){const u=p[k],v=p[k+1],i=INFO[u+'|'+v]||{};
    if(isElev(i))elev=true;
    const fl=(i.mode==='搭電梯'&&i.top)?`（${esc(u)} ${u===i.top?'99樓':'1樓'} → ${esc(v)} ${v===i.top?'99樓':'1樓'}）`:'';
    const hasT=!!(tl&&tl.out[k]&&(isElev(i)||(VEH[i.mode]&&schedOf(i))));
    const txt=[hasT?'':cleanTm(i.tm),cleanTm(i.how&&i.how!==i.mode?i.how:'')].filter(Boolean).join('｜');
    const tline=(tl&&tl.out[k])?`<div class="tl">⏱ ${esc(tl.out[k])}</div>`:'';
    if(i.mode||txt)rows+=`<li><b>${esc(u)} → ${esc(v)}</b>：${i.mode?(ICO[i.mode]||'')+' '+esc(i.mode):''}${fl}${txt?(i.mode?'，':'')+esc(txt):''}${tline}</li>`}
  return (rows?`<ul class="steps">${rows}</ul>`:'')+(elev?elevTable():'')}
function timeSum(tl,now){if(!tl.any)return '';if(tl.end==null)return `<span class="muted">⏱ 以現在 ${hm(now)} 推算，部分交通的時間表還沒補</span>`;return `<span class="tag t-ok">⏱ 預計 ${hm(tl.end)} 抵達</span><span class="muted"> 以現在 ${hm(now)} 推算${tl.skip?'（走路時間不計入）':''}</span>`}
function origPicker(a){const cur=$('orig').value,q=DEST.includes(a)?'這是世界導遊的目的地，你是從哪裡搭過來的？':'這裡只有搭世界導遊才方便離開，你上一次搭世界導遊是從哪裡過來的？';
  return `<div class="po"><div class="muted" style="margin-bottom:4px">🌏 ${q}</div><div class="chips" style="margin:0 0 10px">${origOpts(a).map(o=>`<span class="chip${o[0]===cur?' on':''}" data-po="${esc(o[0])}">${esc(o[1])}</span>`).join('')}</div></div>`}
function show(){showInner();const a=nm($('from').value);if(ASK(a)&&a in adj)$('out').insertAdjacentHTML('afterbegin',origPicker(a));$('resModal').hidden=false;document.documentElement.style.overflow='hidden'}
$('out').addEventListener('click',e=>{const c=e.target.closest('.chip[data-po]');if(!c)return;$('orig').value=c.dataset.po;syncOrig();show()});
function closeRes(){$('resModal').hidden=true;document.documentElement.style.overflow=''}
function showInner(){
  syncOrig();
  const a=nm($('from').value),b=nm($('to').value),el=$('out'),orig=ASK(a)?$('orig').value:'';
  if(!a||!b){el.innerHTML='<span class="muted">請填出發與目的地。</span>';return}
  const bad=[a,b].filter(x=>!(x in adj));
  if(bad.length){el.innerHTML=`<div class="notice">資料裡沒有這些地圖：${bad.map(esc).join('、')}。請從下拉選單或下面的名稱挑選。</div>`;return}
  if(a===b){el.innerHTML='<span class="muted">出發和目的地是同一張地圖。</span>';return}
  if(ASK(a)&&!orig){el.innerHTML=`<div class="notice">「${esc(a)}」${DEST.includes(a)?'是搭世界導遊才到得了的地方':'是個幾乎獨立的地圖，要靠世界導遊離開'}。請先在上面選「從哪裡搭過來的」，這樣才知道你能搭回哪裡。</div>`;return}
  const hop=8   /* 最多走幾步固定 8 步（使用者要求拿掉欄位） */,res=find(a,b,hop,60,orig);
  if(!res.length){el.innerHTML=`<div class="notice">找不到從「${esc(a)}」到「${esc(b)}」的路線（最多 ${hop} 步）。可能還沒填到這條路。</div>`;return}
  const best=res[0].length-1;
  const d0=new Date(),NOW=d0.getHours()*60+d0.getMinutes(),TLS=res.map(p=>timeline(p,NOW));   /* 用查詢當下的時間推算 */
  const card=(p,i)=>`<div class="route"><div class="h">${i+1}．${p.length-1} 步 ${p.length-1===best?'<span class="tag t-ok">最短</span>':''} ${timeSum(TLS[i],NOW)}</div><div class="path">${p.map((n,k)=>`<span class="node">${esc(n)}</span>${k<p.length-1?`<span class="arr">${HOW[n+'|'+p[k+1]]?`<small>${ICO[HOW[n+'|'+p[k+1]]]||''}${esc(HOW[n+'|'+p[k+1]])}</small>`:''}→</span>`:''}`).join('')}</div>${stepsOf(p,TLS[i])}${noteOf(p)}</div>`;
  const top=res.slice(0,3),rest=res.slice(3);
  el.innerHTML=`<b>${esc(a)} → ${esc(b)}</b><div class="muted">最短 ${best} 步；以下是最短的 ${top.length} 條走法。</div>`+top.map(card).join('')+
   (rest.length?`<details class="more"><summary>其他走法（${res.length>=60?'至少 ':''}${rest.length} 條）</summary>${rest.map((p,i)=>card(p,i+3)).join('')}</details>`:'')}
$('go').onclick=show;$('resClose').onclick=closeRes;$('resModal').addEventListener('click',e=>{if(e.target===$('resModal'))closeRes()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeRes()});
$('from').addEventListener('input',syncOrig);$('from').addEventListener('change',syncOrig);$('chips').addEventListener('click',()=>{if(!EDIT)syncOrig()});$('origChips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;$('orig').value=c.dataset.o;[...$('origChips').children].forEach(x=>x.classList.toggle('on',x===c));if($('from').value&&$('to').value)show()});
$('swap').onclick=()=>{const t=$('from').value;$('from').value=$('to').value;$('to').value=t;syncOrig();show()};
['from','to'].forEach(id=>{$(id).addEventListener('keydown',e=>{if(e.key==='Enter')show()});$(id).addEventListener('change',()=>{/* 輸入框改完不自動跳視窗，要按「查詢」或 Enter */})});
$('chips').addEventListener('click',e=>{if(EDIT||justDragged)return;const c=e.target.closest('.chip');if(!c)return;const m=c.dataset.m;if(!$('from').value)$('from').value=m;else if(!$('to').value)$('to').value=m;else{$('from').value=m;$('to').value=''}syncOrig();if($('from').value&&$('to').value)show()});
</script>
