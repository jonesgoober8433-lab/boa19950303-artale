<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>升級時間計算</title>
<link rel="icon" type="image/svg+xml" href="ui/title-icon.svg">
<style>
:root{--bg:#f5ecdb;--card:#fffaf0;--fg:#3a2f25;--muted:#86745f;--line:#e8dcc3;--accent:#a4602a;--accent-ink:#fffaf0;--soft:#f4e8cf;--field:#fdf6e6;--good:#4d7a36;--good-bg:#e6efd9;--warn:#84560f;--warn-bg:#f6e6c4}
*{box-sizing:border-box}html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
header,main{max-width:960px;margin:0 auto;padding:0 16px}
header{padding-top:20px}
h1{margin:0 0 4px;font:700 26px "Noto Serif TC","Songti TC",serif;letter-spacing:.04em}
h2{margin:0 0 6px;font:700 18px "Noto Serif TC",serif}
.sub{color:var(--muted);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 2px}
input,select{font:inherit;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--fg);width:100%}
.in{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.in3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.in,.in3{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;margin:14px 0 10px;flex-wrap:wrap}
.tab{border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:999px;padding:6px 18px;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer}
.tab.on{background:var(--accent);color:var(--accent-ink)}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.res.r3{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.res,.res.r3{grid-template-columns:repeat(2,1fr)}}
.res div{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.res small{color:var(--muted);display:block;font-size:12.5px}.res b{font-size:20px;font-variant-numeric:tabular-nums}
.res .big{background:var(--soft);border-color:var(--accent)}.res .big b{color:var(--accent);font-size:23px}
.blk{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)}
.blk h3{margin:0 0 4px;font-size:15px}
.muted{color:var(--muted);font-size:13px}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13.5px;margin-top:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
button{font:inherit;font-weight:700;border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:999px;padding:3px 16px;cursor:pointer}
.tw{max-height:620px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
@media(max-width:700px){.tw{max-height:340px}}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;background:var(--soft);color:var(--fg);font-weight:700;font-size:13px;padding:8px 12px;border-bottom:2px solid var(--line);z-index:1}
th.l,td.l{text-align:center;width:72px}
td,th{padding:6px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tbody tr:nth-child(even){background:#fdf6e6}
tbody tr:hover{background:var(--soft);cursor:pointer}
tbody tr.me{background:#fdebd9;outline:2px solid #e0803a;outline-offset:-2px;font-weight:700}
tbody td.l{font-weight:700;color:var(--accent)}
.src{color:var(--muted);font-size:12.5px;margin:8px 0}
.combo{display:flex;gap:8px}.combo input{flex:0 0 38%;min-width:0}.combo select{flex:1 1 0;min-width:0}
.mrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.mrow input{width:90px}.mrow button{padding:2px 10px;font-size:13px}.mrow button.on{background:var(--accent);color:var(--accent-ink)}
.pqinfo{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:13.5px;margin-top:10px;line-height:1.7}.pqinfo b{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>升級時間計算</h1>
  <p class="sub">算練功或組隊任務要多久升級。下面有 1～200 級的完整經驗表。</p>
</header>
<main>
  <section class="card">
    <div class="in">
      <div><label for="lvIn">你的等級（可直接輸入，也可從右邊選）</label><div class="combo"><input id="lvIn" type="text" inputmode="numeric" autocomplete="off" placeholder="例如 100"><select id="lv" aria-label="選擇你的等級"></select></div></div>
      <div><label for="pct">目前經驗進度 %（選填，沒填當 0%）</label><input id="pct" type="text" inputmode="decimal" autocomplete="off" placeholder="0"></div>
    </div>
    <div class="tabs" role="tablist"><button type="button" class="tab" data-m="a">⚔️ 練功（每段時間拿多少經驗）</button><button type="button" class="tab" data-m="b">🎯 組隊任務（一場一場算）</button></div>

    <div id="modeA">
      <div class="in">
        <div><label for="tmin">時間（分鐘）</label><input id="tmin" type="text" inputmode="decimal" autocomplete="off" placeholder="10"></div>
        <div><label for="e10" id="e10Lbl">這段時間獲得的經驗</label><input id="e10" type="text" inputmode="numeric" autocomplete="off" placeholder="例如 25000"></div>
      </div>
    </div>
    <div id="modeB" hidden>
      <div class="in">
        <div><label for="pq">組隊任務</label><select id="pq"></select></div>
        <div><label for="mult">經驗倍率（活動期間可自己輸入，也可按右邊 1x～4x，預設 1 倍）</label><div class="mrow"><input id="mult" type="text" inputmode="decimal" autocomplete="off" placeholder="1"><span class="muted">倍</span><button type="button" data-m="1">1x</button><button type="button" data-m="2">2x</button><button type="button" data-m="3">3x</button><button type="button" data-m="4">4x</button></div></div>
      </div>
      <div class="pqinfo" id="pqinfo"></div>
      <div class="in3" style="margin-top:10px">
        <div><label for="pmin">你實際一場多久（分鐘）</label><input id="pmin" type="text" inputmode="decimal" autocomplete="off" placeholder="例如 25"></div>
        <div><label for="pexp">一場獲得經驗（沒活動時的基本值）</label><input id="pexp" type="text" inputmode="numeric" autocomplete="off" placeholder="例如 300000"></div>
        <div><label for="tlvIn">想到的目標等級（可直接輸入，也可從右邊選）</label><div class="combo"><input id="tlvIn" type="text" inputmode="numeric" autocomplete="off" placeholder="例如 120"><select id="tlv" aria-label="選擇目標等級"></select></div></div>
      </div>
      <div class="in" style="margin-top:10px">
        <div><label for="pn">預計跑幾場（選填，算跑完會到幾級）</label><input id="pn" type="text" inputmode="numeric" autocomplete="off" placeholder="例如 20"></div>
      </div>
    </div>
    <div id="out" style="margin-top:12px"></div>
  </section>

  <section class="card">
    <h2>1～200 級經驗表</h2>
    <div class="row"><button id="goMe" type="button">跳到我的等級</button><span class="muted" id="tnote"></span></div>
    <div class="tw" id="tw"><table><thead><tr><th class="l">等級</th><th>升到下一級所需經驗</th><th>累計經驗</th><th id="thTime">升級所需時間</th></tr></thead><tbody id="tb"></tbody></table></div>
    <p class="src">資料來源：<a href="https://mapleartale.com/exp-table/" target="_blank" rel="noopener">冒險島世界 Artale 中文網</a> 的經驗表；累計經驗與逐級加總完全一致，1～12 級也與 <a href="https://artale-tools.archie-design.app/tools/exp-calculator" target="_blank" rel="noopener">Artale 經驗計算機</a> 相同。這不是官方資料，實際請以遊戲為準。200 級那一列是來源表列出的數值。</p>
  </section>
</main>

function state(){
  const L=+$('lv').value,pct=Math.min(99.99,Math.max(0,num($('pct').value)||0));
  const done=need(L)*pct/100;            // 這一級已經有的經驗
  return {L,pct,remain:need(L)-done,abs:cum(L)+done};
}
// ---- 結果
function syncIn(){if(document.activeElement!==$('lvIn'))$('lvIn').value=$('lv').value;if(document.activeElement!==$('tlvIn'))$('tlvIn').value=$('tlv').value}
function calc(){syncIn();
  const s=state(),L=s.L;let h='',col={t:'升級所需時間',f:null};
  if(MODE==='a'){
    const mins=num($('tmin').value),e=num($('e10').value),ok=mins>0&&e>0,N=mins>0?mins:10;
    $('e10Lbl').textContent=`每 ${fx(N,2)} 分鐘獲得的經驗`;
    h=`<div class="res"><div><small>${L} 級升到 ${L+1} 級所需經驗</small><b>${nf(need(L))}</b></div><div><small>還差多少經驗${s.pct?`（已 ${s.pct}%）`:''}</small><b>${nf(s.remain)}</b></div>`;
    if(ok){const blocks=s.remain/e;h+=`<div><small>每 ${fx(N,2)} 分鐘 ${nf(e)} 經驗（約每小時 ${nf(e*60/N)}），需要</small><b>${fx(blocks,blocks<10?2:1)} 個 ${fx(N,2)} 分鐘</b></div><div class="big"><small>預估升級時間</small><b>${fmtTime(blocks*N)}</b></div></div>`;col.f=n=>fmtTime(n/e*N);col.t=`每 ${fx(N,2)} 分鐘 ${nf(e)} 經驗，升級需要`}
    else{h+=`<div><small>每 ${fx(N,2)} 分鐘獲得的經驗</small><b>—</b></div><div class="big"><small>預估升級時間</small><b>—</b></div></div><div class="notice">請輸入「時間」和「獲得的經驗」，才能算出要練多久。</div>`;col.t='升級所需時間（先輸入上面的經驗）'}
  }else{
    const mult=num($('mult').value)>0?num($('mult').value):1,base=num($('pexp').value),e=base>0?base*mult:null,pq0=PQS.find(x=>x.id===$('pq').value),estM=pq0&&pq0.ref&&pq0.ref.mins?pq0.ref.mins:0,mins=num($('pmin').value)>0?num($('pmin').value):estM,ok=mins>0&&e>0,T2=+$('tlv').value,n=num($('pn').value);
    const pq=PQS.find(p=>p.id===$('pq').value);
    if(pq&&pq.id!=='custom'){const lo=L<pq.min||(pq.max&&L>pq.max),r=pq.ref;
      $('pqinfo').innerHTML=`<b>${pq.name}</b>｜等級 ${pq.max?`Lv.${pq.min}～${pq.max}`:`Lv.${pq.min} 以上`}｜${pq.size}｜通關獎勵：${pq.reward}`+
        (r?`<br><b>預估時間</b>：約 ${r.mins} 分鐘${r.guess?'（粗估，沒有找到實測數字）':'（玩家說法）'}${num($('pmin').value)>0?'；目前用你填的 '+fx(num($('pmin').value),1)+' 分鐘計算':'；你沒填實際時間，先用預估計算，可在下面「你實際一場多久」改成自己的'}。<br><b>參考值</b>：${r.note}。經驗已先填入參考值（玩家攻略整理，版本或活動可能不同，可以自己改）。<br><span class="muted">來源：${r.src.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a>`).join('、')}；等級與人數：<a href="https://artale.live/tw/guide/party-quest" target="_blank" rel="noopener">阿泰爾官方「組隊任務教學」</a></span>`:'')+
        (lo?`<br><b>提醒：</b>你的等級（${L}）不在這個任務的等級範圍；官方說明活動期間會提升經驗、也不受等級上限限制。`:'')}
    else $('pqinfo').innerHTML='<span class="muted">自己輸入一場的時間與經驗。也可以從上面的選單選阿泰爾的組隊任務，會顯示等級範圍與通關獎勵。</span>';
    h=`<div class="res r3"><div><small>${L} 級升到 ${L+1} 級所需經驗</small><b>${nf(need(L))}</b></div><div><small>還差多少經驗${s.pct?`（已 ${s.pct}%）`:''}</small><b>${nf(s.remain)}</b></div><div><small>一場${mult!==1&&base>0?`（${nf(base)} × ${fx(mult,2)} 倍）`:''}</small><b>${ok?`${nf(e)} 經驗／${fx(mins,2)} 分`:'—'}</b></div></div>`;
    if(ok){
      const r1=s.remain/e,toT=cum(T2)-s.abs,r2=toT/e;
      h+=`<div class="blk"><h3>① 升到下一級（${L} → ${L+1} 級）</h3><div class="res r3"><div><small>需要場數</small><b>${fx(r1,2)} 場</b></div><div class="big"><small>要跑滿幾場（進位）</small><b>${Math.ceil(r1-1e-9)} 場</b></div><div><small>總時間</small><b>${fmtTime(Math.ceil(r1-1e-9)*mins)}</b></div></div></div>`;
      h+=`<div class="blk"><h3>② 到目標 ${T2} 級</h3><div class="res r3"><div><small>需要總經驗</small><b>${nf(toT)}</b></div><div class="big"><small>要跑幾場（進位）</small><b>${Math.ceil(r2-1e-9)} 場</b><small>約 ${fx(r2,2)} 場</small></div><div><small>總時間</small><b>${fmtTime(Math.ceil(r2-1e-9)*mins)}</b></div></div></div>`;
      if(n>0){const tot=s.abs+n*e;let lv=200;if(tot<cum(200)){lv=1;for(let l=1;l<=200;l++){if(cum(l)<=tot)lv=l;else break}}
        const where=lv>=200&&tot>=cum(200)?`已達 200 級（再多 ${nf(tot-cum(200))} 經驗）`:`${lv} 級 ${fx((tot-cum(lv))/need(lv)*100,2)}%`;
        h+=`<div class="blk"><h3>③ 跑 ${nf(n)} 場之後</h3><div class="res r3"><div><small>獲得經驗</small><b>${nf(n*e)}</b></div><div class="big"><small>會到</small><b>${where}</b></div><div><small>總時間</small><b>${fmtTime(n*mins)}</b></div></div></div>`}
      col.f=nn=>fx(nn/e,1)+' 場';col.t=`每場 ${nf(e)} 經驗，升級需要場數`;
    }else{h+=`<div class="notice">請輸入「一場多久」和「一場獲得經驗」，才能算出要跑幾場。</div>`;col.t='升級所需場數（先輸入上面的經驗）'}
  }
  $('out').innerHTML=h;
  $('tb').innerHTML=T.map(([l,n,c])=>`<tr data-l="${l}" class="${l===L?'me':''}"><td class="l">${l}</td><td>${nf(n)}</td><td>${nf(c)}</td><td>${col.f?col.f(n):'—'}</td></tr>`).join('');
  $('thTime').textContent=col.t;
  $('tnote').textContent=`你的等級：${L} 級（點表格任一列也可以改成那一級）`;
}
function setMode(m){MODE=m;store('mode',m);$('modeA').hidden=m!=='a';$('modeB').hidden=m!=='b';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.m===m));calc()}
// 輸入時不改寫文字（避免打字被打斷），離開欄位再整理千分位
['pct','tmin','e10','pn'].forEach(id=>{$(id).addEventListener('input',()=>{store(id,$(id).value);calc()});
  if(['e10','pn'].includes(id))$(id).addEventListener('blur',()=>{const v=num($(id).value);if(v!=null&&v>=0){$(id).value=nf(v);store(id,$(id).value)}})});
['pmin','pexp'].forEach(id=>{$(id).addEventListener('input',()=>{store(pqKey(id),$(id).value);calc()});
  if(id==='pexp')$(id).addEventListener('blur',()=>{const v=num($(id).value);if(v!=null&&v>=0){$(id).value=nf(v);store(pqKey(id),$(id).value)}})});
$('pq').addEventListener('change',()=>{store('pq',$('pq').value);loadPQ();calc()});
function setMult(v){$('mult').value=v;store('mult',v);document.querySelectorAll('.mrow button').forEach(b=>b.classList.toggle('on',+b.dataset.m===+v));calc()}
$('mult').addEventListener('input',()=>{store('mult',$('mult').value);document.querySelectorAll('.mrow button').forEach(b=>b.classList.toggle('on',+b.dataset.m===num($('mult').value)));calc()});
document.querySelectorAll('.mrow button').forEach(b=>b.addEventListener('click',()=>setMult(b.dataset.m)));
$('lv').addEventListener('change',()=>{store('lv',$('lv').value);fillTarget();store('tlv',$('tlv').value);calc()});
$('tlv').addEventListener('change',()=>{store('tlv',$('tlv').value);calc()});
/* 等級可以輸入也可以選：打字時有效數字就即時計算，不改寫你打的字；離開欄位才整理 */
$('lvIn').addEventListener('input',()=>{const v=parseInt($('lvIn').value.replace(/[^\d]/g,''),10);if(v>=1&&v<=199&&T.some(r=>r[0]===v)){$('lv').value=v;$('lv').dispatchEvent(new Event('change'))}});
$('tlvIn').addEventListener('input',()=>{const v=parseInt($('tlvIn').value.replace(/[^\d]/g,''),10);if([...$('tlv').options].some(o=>+o.value===v)){$('tlv').value=v;$('tlv').dispatchEvent(new Event('change'))}});
[['lvIn','lv'],['tlvIn','tlv']].forEach(x=>$(x[0]).addEventListener('blur',()=>{$(x[0]).value=$(x[1]).value}));
['lvIn','tlvIn'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')$(id).blur()}));
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>setMode(t.dataset.m)));
$('tb').addEventListener('click',e=>{const tr=e.target.closest('tr[data-l]');if(!tr)return;const l=+tr.dataset.l;if(l<=199){$('lv').value=l;store('lv',l);fillTarget();store('tlv',$('tlv').value);const y=$('tw').scrollTop;calc();$('tw').scrollTop=y}});
function goMe(){const tr=document.querySelector('#tb tr.me');if(tr)$('tw').scrollTop=tr.offsetTop-$('tw').clientHeight/2+tr.clientHeight/2}
$('goMe').onclick=goMe;
document.querySelectorAll('.mrow button').forEach(b=>b.classList.toggle('on',+b.dataset.m===num($('mult').value)));
setMode(MODE);goMe();
</script>
