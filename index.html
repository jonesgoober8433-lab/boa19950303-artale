    <script>
        const professionNameMap = {
            "Bishop": "主教",
            "archmage_fp": "火毒大魔導",
            "archmage_il": "冰雷大魔導",
            "Hero": "英雄",
            "Paladin": "聖騎士",
            "DarkKnight": "黑騎士",
            "Bowmaster": "箭神",
            "Marksman": "神射手",
            "Shadower": "暗影神偷",
            "NightLord": "夜使者",
            "Buccaneer": "拳霸",
            "Corsair": "槍神",
            "SoulMaster": "聖魂劍士",
            "FlameWizard": "烈焰巫師",
            "WindBreaker": "破風使者",
            "NightWalker": "暗夜行者",
            "Striker": "閃雷悍將"
        };

        // 建立 key 的對照表，方便在不同格式間轉換
        let mixedKeyToEnglishKeyMap = {};
        let englishKeyToMixedKeyMap = {};

        // Function to generate profession selection grid
        function generateProfessionGrid() {
            const root = document.getElementById('professionGrid');
            root.innerHTML = '';
            // 依職業資料的 group 分成「冒險家」「皇家騎士團」兩區；皇家騎士團是全新職業，特別標示
            const groups = [
                { name: '冒險家', cls: 'explorer', keys: [] },
                { name: '皇家騎士團', cls: 'cygnus', keys: [], isNew: true, tip: '全新職業' }
            ];
            for (const key of Object.keys(professionNameMap)) {
                const mixedKey = findMixedKeyByEnglishKey(key);
                if (!mixedKey) continue;
                const g = (allProfessionsData[mixedKey].group === '皇家騎士團') ? groups[1] : groups[0];
                g.keys.push({ key, mixedKey });
            }
            groups.forEach(g => {
                if (!g.keys.length) return;
                const wrap = document.createElement('div');
                wrap.className = 'job-group ' + g.cls;
                wrap.innerHTML = `<h3 class="job-group-title">${g.name}<span class="job-group-count">${g.keys.length} 個職業</span>${g.isNew ? `<span class="new-badge">NEW ${g.tip}</span>` : ''}</h3>`;
                const grid = document.createElement('div');
                grid.className = 'profession-selection-grid';
                g.keys.forEach(({ key, mixedKey }) => {
                    const data = allProfessionsData[mixedKey];
                    const card = document.createElement('a');
                    card.className = 'profession-card' + (data.isNew ? ' is-new' : '');
                    card.href = `simulator.html?prof=${encodeURIComponent(key)}`;
                    const img = data.cardImage || `emblems/${key}_color.png`;
                    card.innerHTML = `
                        ${data.isNew ? '<em class="card-new">NEW</em>' : ''}
                        <img src="${img}" alt="${key}" onerror="this.onerror=null;this.src='images/default.png';">
                        <span>${professionNameMap[key]}</span>
                    `;
                    grid.appendChild(card);
                });
                wrap.appendChild(grid);
                root.appendChild(wrap);
            });
        }

        // Function to generate recommended builds list
        function generateBuildsList() {
            const list = document.getElementById('buildsList');
            list.innerHTML = '';

            for (const mixedKey in recommendedBuilds) {
                // 確保該職業的推薦配點資料是陣列
                if (!Array.isArray(recommendedBuilds[mixedKey])) continue;

                // 從混合 key (e.g., "主教 (Bishop)") 反向找到程式用的英文 key (e.g., "Bishop")
                const englishKey = findEnglishKeyByMixedKey(mixedKey);
                if (!englishKey) continue; // 如果找不到對應的英文 key，則跳過此推薦配點

                const buildsForProf = recommendedBuilds[mixedKey];
                buildsForProf.forEach((build, index) => {
                    // 確保 build 是有效的物件且有 name 屬性，並跳過暫無的配點
                    if (!build || typeof build.name !== 'string' || build.name.includes("暫無")) {
                        return;
                    }

                    const params = new URLSearchParams({
                        prof: englishKey,
                        // 傳遞配點在陣列中的索引值，讓模擬器頁面知道要顯示哪個配點的詳情
                        buildIndex: index
                    });
                    // 連結到 simulator.html，並帶上參數讓它顯示推薦配點的詳情彈窗
                    const shareUrl = `simulator.html?${params.toString()}`;

                    const card = document.createElement('div');
                    card.className = 'build-card';
                    card.dataset.professionKey = englishKey; // 加上 data attribute 以便篩選
                    card.innerHTML = `
                        <div class="build-card-header">
                            <h3>[${professionNameMap[englishKey]}] ${build.name}</h3>
                            <a href="${shareUrl}" class="view-build-btn">查看配點</a>
                        </div>
                        <p class="build-description">${build.description || ''}</p>
                    `;
                    list.appendChild(card);
                });
            }
        }

        function createSkillNameMap(professionKey) {
            const nameToIdMap = {};
            const professionData = allProfessionsData[professionKey];
            // 增加對資料結構的檢查，確保資料存在且 skills 是物件
            if (!professionData || typeof professionData.skills !== 'object') {
                return nameToIdMap;
            }
            for (const jobStageKey in professionData.skills) {
                const skillsInStage = professionData.skills[jobStageKey];
                // 確保轉職階段的技能資料是陣列
                if (Array.isArray(skillsInStage)) {
                    skillsInStage.forEach(skill => {
                        // 確保 skill 是物件且有 name 和 id
                        if (skill && typeof skill.name !== 'undefined' && typeof skill.id !== 'undefined') {
                            nameToIdMap[skill.name] = skill.id;
                        }
                    });
                }
            }
            return nameToIdMap;
        }

        /**
         * 遍歷 data.js 中的資料，建立一個英文 key 和混合 key 之間的雙向對照表。
         * 這讓後續的查找更高效，也更容易除錯。
         */
        function buildKeyMaps() {
            mixedKeyToEnglishKeyMap = {};
            englishKeyToMixedKeyMap = {};

            for (const mixedKey in allProfessionsData) {
                // 從我們的標準對照表 (professionNameMap) 中找到對應的英文 key
                const englishKey = Object.keys(professionNameMap).find(key => mixedKey.startsWith(professionNameMap[key]));
                if (englishKey) {
                    mixedKeyToEnglishKeyMap[mixedKey] = englishKey;
                    englishKeyToMixedKeyMap[englishKey] = mixedKey;
                } else {
                    // 如果 data.js 中的某個 key 找不到對應，給出警告
                    console.warn(`警告：在 data.js 中找到的 key "${mixedKey}" 無法對應到任何已知的職業。`);
                }
            }
            console.log("成功建立職業 Key 對照表:", { englishToMixed: englishKeyToMixedKeyMap, mixedToEnglish: mixedKeyToEnglishKeyMap });
        }

        /**
         * 根據程式用的英文 key (e.g., "Bishop")，從 allProfessionsData 中找到對應的混合 key (e.g., "主教 (Bishop)")。
         */
        function findMixedKeyByEnglishKey(englishKey) {
            return englishKeyToMixedKeyMap[englishKey] || null;
        }

        /**
         * 根據 data.js 中的混合 key (e.g., "主教 (Bishop)")，找到程式內部使用的英文 key (e.g., "Bishop")。
         */
        function findEnglishKeyByMixedKey(mixedKey) {
            return mixedKeyToEnglishKeyMap[mixedKey] || null;
        }

        /**
         * 設定更新日誌的「顯示更多」功能。
         * 預設只顯示最新的 3 條，點擊按鈕後顯示全部。
         */
        function setupUpdateLog() {
            const logList = document.querySelector('#updateLog ul');
            if (!logList) return; // 防呆

            const logItems = logList.querySelectorAll('li');
            const LOG_LIMIT = 2; // 設定要顯示的數量

            if (logItems.length > LOG_LIMIT) {
                // 預設隱藏超過限制的項目
                for (let i = LOG_LIMIT; i < logItems.length; i++) {
                    logItems[i].classList.add('hidden');
                }

                // 建立「顯示更多」按鈕
                const showMoreContainer = document.createElement('div');
                showMoreContainer.className = 'show-more-container';
                const showMoreBtn = document.createElement('button');
                showMoreBtn.className = 'show-more-btn';
                showMoreBtn.textContent = '顯示更多';
                showMoreContainer.appendChild(showMoreBtn);

                // 將按鈕容器加到列表後面
                logList.after(showMoreContainer);

                // 綁定點擊事件
                showMoreBtn.addEventListener('click', () => {
                    logList.classList.add('expanded'); // 讓列表可以滾動
                    logItems.forEach(item => item.classList.remove('hidden')); // 顯示所有項目
                    showMoreContainer.remove(); // 移除按鈕
                });
            }
        }

        /**
         * 填充職業篩選的下拉選單。
         */
        function populateProfessionFilter() {
            const filterSelect = document.getElementById('professionFilter');
            if (!filterSelect) return;

            // 新增預設選項
            filterSelect.innerHTML = '<option value="all">所有職業</option>';

            // 依照定義好的順序，從 professionNameMap 新增各職業選項
            for (const key of Object.keys(professionNameMap)) {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = professionNameMap[key];
                filterSelect.appendChild(option);
            }
        }

        /**
         * 設定推薦文列表的篩選功能 (包含關鍵字搜尋與職業下拉選單)。
         * 監聽兩個控制項的變動，並即時更新列表。
         */
        function setupBuildsFilter() {
            const searchInput = document.getElementById('buildsSearchInput');
            const professionFilter = document.getElementById('professionFilter');
            const buildsList = document.getElementById('buildsList');
            const noResultsMessage = document.getElementById('noBuildsFound'); // 新增：獲取提示訊息元素

            if (!searchInput || !professionFilter || !buildsList || !noResultsMessage) return; // 新增：檢查提示訊息元素

            const filterAction = () => {
                const searchTerm = searchInput.value.toLowerCase().trim();
                const selectedProfession = professionFilter.value;
                const buildCards = buildsList.querySelectorAll('.build-card');
                let visibleCount = 0; // 新增：用於計算可見卡片的計數器

                buildCards.forEach(card => {
                    const cardProfession = card.dataset.professionKey;
                    const title = card.querySelector('h3').textContent.toLowerCase();
                    const description = card.querySelector('.build-description').textContent.toLowerCase();

                    const professionMatch = (selectedProfession === 'all') || (cardProfession === selectedProfession);
                    const searchMatch = title.includes(searchTerm) || description.includes(searchTerm);

                    if (professionMatch && searchMatch) {
                        card.style.display = '';
                        visibleCount++;
                    } else {
                        card.style.display = 'none';
                    }
                });
                // 新增：根據可見卡片數量，顯示或隱藏「查無結果」的訊息
                noResultsMessage.style.display = visibleCount === 0 ? 'block' : 'none';
            };

            searchInput.addEventListener('input', filterAction);
            professionFilter.addEventListener('change', filterAction);
        }

        /**
         * 設定「回到頂部」按鈕的功能。
         * 按鈕會在使用者向下滾動一定距離後出現。
         */
        function setupBackToTopButton() {
            const backToTopBtn = document.getElementById('backToTopBtn');
            if (!backToTopBtn) return;

            // 當使用者滾動頁面時，決定是否顯示按鈕
            window.addEventListener('scroll', () => {
                // 為了跨瀏覽器相容性，同時檢查 document.body.scrollTop 和 document.documentElement.scrollTop
                if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                    backToTopBtn.classList.add('show');
                } else {
                    backToTopBtn.classList.remove('show');
                }
            });

            // 當使用者點擊按鈕時，平滑滾動到頁面頂部
            backToTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            // 進行更詳細的檢查，確保 data.js 的資料都已正確載入
            let errorMessages = [];

            // 檢查 allProfessionsData 是否已正確載入且為物件
            if (typeof allProfessionsData !== 'object' || allProfessionsData === null) {
                errorMessages.push("職業資料 (allProfessionsData) 未載入或格式不正確。");
            }
            // 檢查 recommendedBuilds 是否已正確載入且為物件
            if (typeof recommendedBuilds !== 'object' || recommendedBuilds === null) {
                errorMessages.push("推薦配點資料 (recommendedBuilds) 未載入或格式不正確。");
            }

            if (errorMessages.length === 0) {
                try {
                    buildKeyMaps(); // 優先建立對照表
                    generateProfessionGrid();
                    setupUpdateLog(); // 初始化更新日誌顯示
                    setupBackToTopButton(); // 初始化回到頂部按鈕
                } catch (e) {
                    console.error("在生成頁面內容時發生錯誤:", e);
                    document.getElementById('professionGrid').innerHTML = `<p style="color: red; text-align: center;">頁面內容生成失敗，可能是 data.js 的資料格式有誤。<br>詳細錯誤請見瀏覽器開發者工具(F12)的 Console。</p>`;
                    // 清空推薦列表以防部分渲染
                }
            } else {
                const finalMessage = "錯誤：資料載入失敗！請檢查 data.js 檔案。\n" + errorMessages.join("\n");
                console.error(finalMessage);
                document.getElementById('professionGrid').innerHTML = `<p style="color: red; text-align: center;">資料載入失敗，請確認 data.js 檔案存在且內容正確。<br>詳細錯誤請見瀏覽器開發者工具(F12)的 Console。</p>`;
            }
        });
    </script>
